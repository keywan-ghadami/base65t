# The reference implementation, checked. Everything here is fast; there is no
# benchmark in this repository, because a number measured on a shared runner
# belongs where the other codecs' numbers are taken.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: The reference implementation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The test names say what they prove: §15 vector by vector, the four
      # conformance points of §16, and each of the twelve error codes of §10.4.
      # `against_the_system` needs base64(1) and Python, which the runner has;
      # it skips rather than fails where they are missing.
      - name: Test
        working-directory: rust
        run: cargo test --release -- --nocapture

      # The `simd` feature swaps the base64 writer for a vectorised one and
      # must not change a byte. `tests/simd.rs` checks the writer against RFC
      # 4648 read plainly, so it is worth running in both builds; the rest of
      # the suite then says the streams and the vectors are unmoved.
      - name: The same bytes with the vectorised writer
        working-directory: rust
        run: cargo test --release --features simd

      # `--all-targets`, so this covers the examples too. It has caught a
      # lint in one of them that the test run does not compile.
      - name: Warnings are errors
        working-directory: rust
        run: |
          cargo clippy --all-targets --release -- -D warnings
          cargo clippy --all-targets --release --features simd -- -D warnings

      - name: Formatting
        working-directory: rust
        run: cargo fmt --check

      # §12's measured rows, recomputed. Not asserted here -- the exact bounds
      # are asserted in tests/never_worse.rs -- but printed, so a change in the
      # encoder's judgement shows up in the log of the run that made it.
      - name: Density
        working-directory: rust
        run: cargo run --release --example density

  # Conformance point 3 of §16 wants two implementations that agree, so the
  # second one runs here rather than beside the first: it is written from the
  # specification, shares no code with the Rust crate, and checks itself
  # against the published vectors the Rust crate writes. Point 6 is the
  # container test, against Python's own URL, cookie and JSON parsers.
  #
  # This is `conformance/`, not `python/`. The latter is a binding over the
  # same Rust and therefore cannot disagree with it about anything.
  conformance:
    name: The second implementation, and the containers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: It agrees with the published vectors
        run: python3 conformance/test_vectors.py

      - name: Real parsers take what profile U writes
        run: python3 conformance/test_containers.py

      # The published vectors stop below a kilobyte, and a segmentation
      # mistake hides above that -- one did. One implementation encodes a
      # quarter-megabyte stream, the other encodes it again and decodes what
      # the first wrote; §9.2.1 is linear, so both are cheap.
      - uses: dtolnay/rust-toolchain@stable
      - name: A long stream, across implementations
        run: |
          cd rust
          cargo run --release --quiet --example large_sample -- /tmp/in.bin /tmp/in.b65
          cd ..
          python3 conformance/test_large.py /tmp/in.bin /tmp/in.b65

  # The shipped Python distribution is a PyO3 layer over the same crate, so
  # what it can get wrong is the layer: argument types, the preset and profile
  # names, the fields of the result, the error code. That is what its tests
  # are about, and the vectors are in them only to catch a binding that
  # silently encodes everything as `dense`.
  python-bindings:
    name: The Python bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build the wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build --release --out dist

      - name: Install it and test what the layer is responsible for
        working-directory: python
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pytest tests -q
