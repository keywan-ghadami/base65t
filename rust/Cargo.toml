[package]
name = "base65t"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "Base65t: Base64URL plus a 65th character, in fixed blocks that keep text in the clear."
license = "MPL-2.0"
repository = "https://github.com/keywan-ghadami/base65t"
publish = false

[lib]
name = "base65t"
path = "src/lib.rs"

# No dependencies, and none in the tests either. The differential checks the
# specification asks for in §16.2 run against `base64(1)` and Python, the way
# binary2textbench checks its own baseline: a crate would only tell us that
# two Rust crates agree.
#
# There is no `simd` feature any more. The one v0.3 had swapped the base64
# writer for a vectorised kernel across runs of data-dependent length; the
# block format has base64 runs of exactly sixty-four characters and no runs
# to find, so if a vectorised path is ever worth adding it is a different and
# much smaller change.
[dependencies]

[profile.release]
opt-level = 3
